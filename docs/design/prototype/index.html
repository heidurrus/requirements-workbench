<div class="app" id="app">
  <aside class="sidebar" aria-label="Навигация">
    <button class="proj" id="proj" aria-haspopup="menu" title="Сменить проект">
      <span class="proj-mark">ПД</span>
      <span class="grow lbl"><span class="proj-name trunc" style="display:block">Портал дилера</span><span class="proj-sub"><svg class="i s12"><use href="#i-cloud"/></svg>Claude · облако</span></span>
      <svg class="i s14 t3 lbl"><use href="#i-updown"/></svg>
    </button>
    <button class="cmd" id="cmd-open" title="Поиск и команды · ⌘K"><svg class="i s14"><use href="#i-search"/></svg><span class="grow lbl">Поиск и команды</span><span class="kbd lbl">⌘K</span></button>

    <nav class="nav scroll grow" id="nav"></nav>

    <div class="side-foot">
      <div class="job" role="status">
        <div class="job-title"><span class="spinner"></span><span class="trunc">Распознаю «Демо текущей системы»</span></div>
        <div class="progress" style="--p:42"><i></i></div>
        <div class="job-sub num"><span>42% · осталось около 6 мин</span><span>1 в очереди</span></div>
      </div>
      <nav class="nav">
        <button class="nav-row" data-go="skills" title="Скиллы"><svg class="i"><use href="#i-skills"/></svg><span class="lbl grow">Скиллы</span></button>
        <button class="nav-row" data-go="settings" title="Настройки · ⌘,"><svg class="i"><use href="#i-gear"/></svg><span class="lbl grow">Настройки</span></button>
      </nav>
    </div>
  </aside>

  <div class="main">
    <header class="toolbar" id="toolbar"></header>
    <div class="workspace" id="workspace"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="palette" id="palette" role="dialog" aria-label="Поиск и команды">
  <div class="palette-input"><svg class="i s20"><use href="#i-search"/></svg><input id="palette-q" placeholder="Команда, экран, источник или FR-12" autocomplete="off"><span class="kbd">esc</span></div>
  <div class="palette-list scroll" id="palette-list"></div>
</div>
<div class="sheet" id="sheet" role="alertdialog" aria-labelledby="sheet-t"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
